spring:
  application:
    name: spring-mcp-1c-copilot
  ai:
    mcp:
      server:
        name: "1C Copilot MCP Server"
        version: "1.1.0"
        instructions: "MCP сервер для работы с 1С:Напарник API. Предоставляет инструменты для вопросов к ИИ, объяснения синтаксиса и проверки кода 1С."
        protocol: STREAMABLE
        type: SYNC
        stdio: false
        capabilities:
          tool: true
          resource: true
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 1s

# Настройки 1С:Напарник API
onec:
  ai:
    token: ${ONEC_AI_TOKEN:}
    token-file: ${ONEC_AI_TOKEN_FILE:}
    base-url: ${ONEC_AI_BASE_URL:https://code.1c.ai}
    timeout: ${ONEC_AI_TIMEOUT:30}
    skill-name: ${ONEC_AI_SKILL_NAME:raw}
    ui-language: ${ONEC_AI_UI_LANGUAGE:russian}

# Настройки сервера
server:
  port: ${SSE_PORT:8000}

# Swagger/OpenAPI конфигурация
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: true

# Настройки логирования
logging:
  level:
    root: INFO
    ru.alkoleft.copilot: DEBUG
    org.springframework.ai.mcp: INFO
