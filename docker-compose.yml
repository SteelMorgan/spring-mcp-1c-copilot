services:
  spring-mcp-1c-copilot:
    build:
      context: .
      dockerfile: Dockerfile.build
    container_name: spring-mcp-1c-copilot
    ports:
      - "8186:8000"
    environment:
      # 1С:Напарник API настройки
      ONEC_AI_TOKEN: "${ONEC_AI_TOKEN:-}"
      ONEC_AI_TOKEN_FILE: "/run/secrets/onec_ai_token"
      ONEC_AI_BASE_URL: "https://code.1c.ai"
      ONEC_AI_TIMEOUT: "30"
      ONEC_AI_SKILL_NAME: "${ONEC_AI_SKILL_NAME:-raw}"
      ONEC_AI_UI_LANGUAGE: "russian"
      
      # MCP настройки
      SSE_PORT: "8000"
      # По умолчанию transport для Codex и других streamable HTTP клиентов берётся из application.yml.
      # Для совместимости с SSE-клиентами можно запускать контейнер с SPRING_PROFILES_ACTIVE=sse.
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-}"
      LOG_LEVEL: "INFO"
    volumes:
      - ./.secrets/onec_ai_token:/run/secrets/onec_ai_token:ro
    networks:
      - default
    restart: unless-stopped
